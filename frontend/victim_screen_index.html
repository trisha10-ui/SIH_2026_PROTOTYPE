<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHAA Support Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #fff8ef;"></body>
    <div class="container mt-5 mb-5" style="max-width: 500px;"></div>
    <div class="text-center mb-4">
    <span class="badge bg-white text-secondary border">
        NHAA National Helpline · 14566
    </span>

    <h5 class="mt-3 text-secondary">
        You are safe here. You are heard.
    </h5>
</div>
<div style="width: 100%; max-width: 480px; margin: 0 auto;">
    <div class="card border-0 shadow-sm" style="background-color: #ffdce8;">
   <div class="card-body p-3"></div>
    <h3 class="mb-3 text-center">
    How are you feeling right now?
</h3>
    <textarea id="msgBox" class="form-control" rows="4" placeholder="Type here..."></textarea>
    <button class="btn btn-primary mt-3 w-100" onclick="saveMessage()">Submit</button>
    <p id="status" class="mt-2 text-success"></p>
        </div>
</div>
<div style="width: 100%; max-width: 480px; margin: 16px auto 0;">
    <div class="alert alert-danger small mb-0">
        <strong>Immediate Danger?</strong>
        If you or someone else is at risk of immediate harm,
        please dial <strong>112</strong> or go to the nearest emergency room.
    </div>
</div>

    </div>

    <script>
        function saveMessage(){
            const text=document.getElementById("msgBox").value;
            if(!text.trim())
        {
            alert("Please type a message first.");
            return;
        }

        const blob=new Blob([text],{
            type:"text/plain"
        });
        const link=document.createElement("a");
        link.href=URL.createObjectURL(blob);
        link.download="messages.txt";
        link.click();

        document.getElementById("status").innerText="Message saved as Messages.txt ";
        }
    </script>
</body>
</html>
